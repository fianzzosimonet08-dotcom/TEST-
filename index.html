<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProFacile - Planning & Calendrier</title>
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 h-full flex flex-col font-sans">

    <!-- Top Navigation Bar -->
    <header class="bg-slate-900 text-white shadow-md z-20 flex-shrink-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="switchTab('calendar')">
                <div class="bg-brand-500 text-white p-2 rounded-xl shadow-inner flex items-center justify-center w-10 h-10">
                    <i class="fa-solid fa-briefcase text-lg"></i>
                </div>
                <div>
                    <span class="text-xl font-black tracking-tight bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">ProFacile</span>
                    <span class="block text-[10px] text-slate-400 font-medium uppercase tracking-wider">Planning Calendrier</span>
                </div>
            </div>

            <div class="flex items-center space-x-1">
                <button onclick="switchTab('calendar')" id="nav-btn-calendar" class="nav-btn px-4 py-2 rounded-lg text-sm font-medium transition-colors bg-brand-600 text-white">
                    <i class="fa-solid fa-calendar-days mr-2"></i> Calendrier & Tâches
                </button>
                <button onclick="switchTab('archives')" id="nav-btn-archives" class="nav-btn px-4 py-2 rounded-lg text-sm font-medium transition-colors text-slate-300 hover:bg-slate-800 hover:text-white">
                    <i class="fa-solid fa-box-archive mr-2"></i> Archives (<span id="archive-count">0</span>)
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- ==================== TAB: CALENDAR ==================== -->
        <div id="tab-calendar" class="tab-content space-y-6">
            
            <!-- En-tête du Mois & Navigation -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col sm:flex-row justify-between items-center gap-4">
                <div class="flex items-center space-x-4">
                    <button onclick="changeMonth(-1)" class="w-10 h-10 rounded-xl bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-700 transition">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <h2 id="calendar-month-title" class="text-2xl font-black text-slate-900 tracking-tight capitalize">Octobre 2026</h2>
                    <button onclick="changeMonth(1)" class="w-10 h-10 rounded-xl bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-700 transition">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>
                <button onclick="goToCurrentMonth()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-sm transition">
                    Aujourd'hui
                </button>
            </div>

            <!-- Grille du Calendrier -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <!-- Jours de la semaine -->
                <div class="grid grid-cols-7 bg-slate-100 border-b border-slate-200 text-center text-xs font-bold text-slate-600 uppercase py-3">
                    <div>Lun</div>
                    <div>Mar</div>
                    <div>Mer</div>
                    <div>Jeu</div>
                    <div>Ven</div>
                    <div>Sam</div>
                    <div>Dim</div>
                </div>
                <!-- Cases des jours générées dynamiquement -->
                <div id="calendar-grid" class="grid grid-cols-7 auto-rows-fr bg-slate-200 gap-px">
                    <!-- Les cellules du calendrier s'injectent ici -->
                </div>
            </div>
        </div>

        <!-- ==================== TAB: ARCHIVES ==================== -->
        <div id="tab-archives" class="tab-content hidden space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center">
                <div>
                    <h2 class="text-2xl font-black text-slate-900 tracking-tight flex items-center">
                        <i class="fa-solid fa-box-archive text-brand-600 mr-3"></i> Archives des Tâches Terminées
                    </h2>
                    <p class="text-slate-500 text-sm">Retrouvez toutes les tâches et appels que vous avez validés.</p>
                </div>
                <button onclick="clearArchives()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold px-4 py-2 rounded-xl text-xs transition border border-rose-200">
                    <i class="fa-solid fa-trash-can mr-1.5"></i> Vider les archives
                </button>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <div id="archives-list" class="space-y-3">
                    <!-- Injecté par JS -->
                </div>
            </div>
        </div>

    </main>

    <!-- ==================== MODAL AJOUT / GESTION DE JOUR ==================== -->
    <div id="day-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden flex flex-col max-h-[90vh]">
            <!-- Modal Header -->
            <div class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center">
                <h3 id="modal-date-title" class="text-lg font-bold">Tâches pour le 30/10/2026</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <!-- Modal Body -->
            <div class="p-6 overflow-y-auto space-y-6 flex-1">
                <!-- Liste des tâches du jour -->
                <div class="space-y-3">
                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Tâches prévues ce jour</h4>
                    <div id="modal-tasks-list" class="space-y-2">
                        <!-- Injecté par JS -->
                    </div>
                </div>

                <!-- Formulaire ajout de tâche rapide -->
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                    <h4 class="text-xs font-bold text-slate-700 uppercase">Ajouter une tâche à cette date</h4>
                    <form onsubmit="addTaskToDate(event)" class="space-y-3">
                        <input type="hidden" id="modal-target-date">
                        <div>
                            <input type="text" id="task-title" required placeholder="Nom du client / Quoi faire (ex: Appel client Dupont)" class="w-full px-3 py-2 bg-white border border-slate-300 rounded-xl text-sm focus:outline-none focus:border-brand-500">
                        </div>
                        <div>
                            <input type="tel" id="task-phone" placeholder="Numéro de téléphone (optionnel, ex: 06 12 34 56 78)" class="w-full px-3 py-2 bg-white border border-slate-300 rounded-xl text-sm focus:outline-none focus:border-brand-500">
                        </div>
                        <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-2 rounded-xl text-sm transition shadow-sm">
                            <i class="fa-solid fa-plus mr-1.5"></i> Ajouter la tâche
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        let currentTab = 'calendar';
        let currentDate = new Date(); // Mois et année actuellement affichés
        let selectedDateStr = ''; // Date cliquée au format YYYY-MM-DD

        // Données stockées localement
        let tasks = JSON.parse(localStorage.getItem('profacile_calendar_tasks')) || [];
        let archives = JSON.parse(localStorage.getItem('profacile_calendar_archives')) || [];

        function saveData() {
            localStorage.setItem('profacile_calendar_tasks', JSON.stringify(tasks));
            localStorage.setItem('profacile_calendar_archives', JSON.stringify(archives));
            updateArchiveCount();
        }

        function updateArchiveCount() {
            document.getElementById('archive-count').innerText = archives.length;
        }

        function switchTab(tabId) {
            currentTab = tabId;
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');

            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.className = 'nav-btn px-4 py-2 rounded-lg text-sm font-medium transition-colors text-slate-300 hover:bg-slate-800 hover:text-white';
            });
            document.getElementById(`nav-btn-${tabId}`).className = 'nav-btn px-4 py-2 rounded-lg text-sm font-medium transition-colors bg-brand-600 text-white';

            if (tabId === 'calendar') renderCalendar();
            if (tabId === 'archives') renderArchives();
        }

        // ==================== CALENDRIER MENSUEL ====================
        function changeMonth(direction) {
            currentDate.setMonth(currentDate.getMonth() + direction);
            renderCalendar();
        }

        function goToCurrentMonth() {
            currentDate = new Date();
            renderCalendar();
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            // Titre du mois
            const monthNames = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"];
            document.getElementById('calendar-month-title').innerText = `${monthNames[month]} ${year}`;

            // Premier jour du mois (0 = Dimanche, 1 = Lundi, etc.)
            let firstDayIndex = new Date(year, month, 1).getDay();
            // Ajustement pour commencer la semaine un Lundi (0 pour Lundi, 6 pour Dimanche)
            firstDayIndex = (firstDayIndex === 0) ? 6 : firstDayIndex - 1;

            // Nombre de jours dans le mois
            const totalDays = new Date(year, month + 1, 0).getDate();
            // Nombre de jours dans le mois précédent
            const prevTotalDays = new Date(year, month, 0).getDate();

            const todayStr = new Date().toISOString().split('T')[0];

            // 1. Jours du mois précédent (grisés)
            for (let i = firstDayIndex - 1; i >= 0; i--) {
                const dayNum = prevTotalDays - i;
                const cell = createCell(null, dayNum, true);
                grid.appendChild(cell);
            }

            // 2. Jours du mois en cours
            for (let day = 1; day <= totalDays; day++) {
                const formattedMonth = String(month + 1).padStart(2, '0');
                const formattedDay = String(day).padStart(2, '0');
                const dateStr = `${year}-${formattedMonth}-${formattedDay}`;

                const isToday = (dateStr === todayStr);
                const cell = createCell(dateStr, day, false, isToday);
                grid.appendChild(cell);
            }

            // 3. Jours du mois suivant pour remplir la grille (jusqu'à 35 ou 42 cases)
            const totalCellsSoFar = firstDayIndex + totalDays;
            const nextDaysCount = totalCellsSoFar <= 35 ? 35 - totalCellsSoFar : 42 - totalCellsSoFar;
            for (let day = 1; day <= nextDaysCount; day++) {
                const cell = createCell(null, day, true);
                grid.appendChild(cell);
            }
        }

        function createCell(dateStr, dayNum, isOutside, isToday = false) {
            const cell = document.createElement('div');
            cell.className = `bg-white min-h-[110px] p-2 flex flex-col justify-between transition ${isOutside ? 'bg-slate-50/60 text-slate-400' : 'hover:bg-slate-50 cursor-pointer'}`;
            
            if (dateStr) {
                cell.onclick = () => openDayModal(dateStr);
            }

            // En-tête de la case (Numéro du jour)
            let headerHtml = `<div class="flex justify-between items-center">
                <span class="text-xs font-bold ${isToday ? 'bg-brand-600 text-white w-6 h-6 rounded-full flex items-center justify-center' : (isOutside ? 'text-slate-400' : 'text-slate-700')}">${dayNum}</span>
            `;
            if (dateStr) {
                const dayTasks = tasks.filter(t => t.date === dateStr);
                if (dayTasks.length > 0) {
                    headerHtml += `<span class="bg-indigo-100 text-brand-700 text-[10px] font-bold px-1.5 py-0.5 rounded-full">${dayTasks.length}</span>`;
                }
            }
            headerHtml += `</div>`;

            // Liste miniature des tâches directement visibles sur la case du calendrier
            let tasksPreviewHtml = `<div class="space-y-1 mt-1 overflow-hidden flex-1">`;
            if (dateStr) {
                const dayTasks = tasks.filter(t => t.date === dateStr);
                dayTasks.slice(0, 2).forEach(t => {
                    tasksPreviewHtml += `<div class="bg-brand-50 text-brand-700 text-[11px] font-medium px-1.5 py-0.5 rounded truncate border border-brand-100">• ${t.title}</div>`;
                });
                if (dayTasks.length > 2) {
                    tasksPreviewHtml += `<div class="text-[10px] text-slate-400 font-semibold pl-1">+${dayTasks.length - 2} autres...</div>`;
                }
            }
            tasksPreviewHtml += `</div>`;

            cell.innerHTML = headerHtml + tasksPreviewHtml;
            return cell;
        }

        // ==================== MODAL GESTION DU JOUR ====================
        function openDayModal(dateStr) {
            selectedDateStr = dateStr;
            document.getElementById('modal-target-date').value = dateStr;

            // Formater joliment la date pour le titre
            const [y, m, d] = dateStr.split('-');
            document.getElementById('modal-date-title').innerText = `Tâches pour le ${d}/${m}/${y}`;

            renderModalTasks();
            document.getElementById('day-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('day-modal').classList.add('hidden');
            renderCalendar(); // Rafraîchir le calendrier pour voir les compteurs de tâches mis à jour
        }

        function renderModalTasks() {
            const listContainer = document.getElementById('modal-tasks-list');
            listContainer.innerHTML = '';

            const dayTasks = tasks.filter(t => t.date === selectedDateStr);

            if (dayTasks.length === 0) {
                listContainer.innerHTML = `<p class="text-xs text-slate-400 italic py-2">Aucune tâche enregistrée pour ce jour.</p>`;
                return;
            }

            dayTasks.forEach(t => {
                const item = document.createElement('div');
                item.className = 'p-3 bg-slate-50 border border-slate-200 rounded-xl flex items-center justify-between gap-2';
                
                let phoneBtn = '';
                if (t.phone) {
                    phoneBtn = `<a href="tel:${t.phone}" class="text-emerald-600 bg-emerald-50 hover:bg-emerald-100 px-2.5 py-1 rounded-lg text-xs font-bold transition flex items-center"><i class="fa-solid fa-phone mr-1"></i> ${t.phone}</a>`;
                }

                item.innerHTML = `
                    <div class="space-y-0.5 overflow-hidden flex-1">
                        <div class="font-bold text-slate-900 text-sm truncate">${t.title}</div>
                        ${phoneBtn ? `<div>${phoneBtn}</div>` : ''}
                    </div>
                    <div class="flex items-center space-x-1 flex-shrink-0">
                        <button onclick="completeTask('${t.id}')" title="Terminer et archiver" class="w-8 h-8 bg-emerald-50 hover:bg-emerald-600 text-emerald-600 hover:text-white rounded-lg transition flex items-center justify-center">
                            <i class="fa-solid fa-check text-xs"></i>
                        </button>
                        <button onclick="deleteTask('${t.id}')" title="Supprimer" class="w-8 h-8 bg-rose-50 hover:bg-rose-600 text-rose-600 hover:text-white rounded-lg transition flex items-center justify-center">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    </div>
                `;
                listContainer.appendChild(item);
            });
        }

        function addTaskToDate(e) {
            e.preventDefault();
            const title = document.getElementById('task-title').value;
            const phone = document.getElementById('task-phone').value;

            const newTask = {
                id: 'task_' + Date.now(),
                date: selectedDateStr,
                title,
                phone
            };

            tasks.push(newTask);
            saveData();

            document.getElementById('task-title').value = '';
            document.getElementById('task-phone').value = '';
            renderModalTasks();
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveData();
            renderModalTasks();
        }

        function completeTask(id) {
            const index = tasks.findIndex(t => t.id === id);
            if (index !== -1) {
                const finished = tasks.splice(index, 1)[0];
                finished.archivedAt = new Date().toLocaleString('fr-FR');
                archives.push(finished);
                saveData();
                renderModalTasks();
            }
        }

        // ==================== ARCHIVES ====================
        function renderArchives() {
            const container = document.getElementById('archives-list');
            container.innerHTML = '';

            if (archives.length === 0) {
                container.innerHTML = `
                    <div class="py-12 text-center text-slate-400">
                        <i class="fa-solid fa-box-open text-3xl mb-2 text-slate-300"></i>
                        <p class="text-sm font-medium">Aucune archive pour le moment.</p>
                        <p class="text-xs text-slate-400 mt-1">Validez des tâches depuis le calendrier pour les retrouver ici.</p>
                    </div>
                `;
                return;
            }

            archives.forEach(a => {
                const card = document.createElement('div');
                card.className = 'p-4 rounded-xl border border-slate-200 bg-slate-50 flex justify-between items-center';
                card.innerHTML = `
                    <div class="space-y-1">
                        <div class="flex items-center space-x-2">
                            <span class="bg-emerald-100 text-emerald-800 text-xs font-bold px-2 py-0.5 rounded">Terminé</span>
                            <h4 class="font-bold text-slate-900 text-sm">${a.title}</h4>
                        </div>
                        <span class="text-xs text-slate-500 block">Prévu le : ${a.date} | Archivé le : ${a.archivedAt}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function clearArchives() {
            if (confirm('Voulez-vous vraiment vider toutes les archives ?')) {
                archives = [];
                saveData();
                renderArchives();
            }
        }

        // Initialisation au chargement
        window.onload = function() {
            renderCalendar();
            updateArchiveCount();
        };
    </script>
</body>
</html>
